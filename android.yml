name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/smcsingle/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SMCSingle"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.smcsingle.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.smcsingle.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="SMC + ICT Single">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#285BD7</item>
                  <item name="android:statusBarColor">#080D18</item>
                  <item name="android:navigationBarColor">#080D18</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical"
              android:padding="18dp"
              android:background="#080D18"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <TextView
                  android:text="SMC + ICT Single"
                  android:textColor="#FFFFFF"
                  android:textSize="25sp"
                  android:textStyle="bold"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>

              <TextView
                  android:text="REAL MARKET ANALYSIS • PAPER"
                  android:textColor="#9DB6FF"
                  android:layout_marginTop="6dp"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>

              <TextView
                  android:id="@+id/pair"
                  android:text="LOADING..."
                  android:textColor="#FFFFFF"
                  android:textSize="30sp"
                  android:textStyle="bold"
                  android:layout_marginTop="35dp"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>

              <TextView
                  android:id="@+id/signal"
                  android:text="WAITING"
                  android:textColor="#FFD166"
                  android:textSize="38sp"
                  android:textStyle="bold"
                  android:layout_marginTop="15dp"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>

              <TextView
                  android:id="@+id/details"
                  android:text="Loading signal..."
                  android:textColor="#FFFFFF"
                  android:textSize="17sp"
                  android:layout_marginTop="20dp"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>

              <Button
                  android:id="@+id/refresh"
                  android:text="REFRESH SIGNAL"
                  android:layout_marginTop="25dp"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>

              <TextView
                  android:id="@+id/updated"
                  android:text="Waiting..."
                  android:textColor="#AEBBD2"
                  android:layout_marginTop="20dp"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/smcsingle/app/MainActivity.java <<'EOF'
          package com.smcsingle.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.widget.TextView;
          import android.widget.Button;

          import org.json.JSONObject;

          import java.net.URL;
          import java.net.HttpURLConnection;

          public class MainActivity extends Activity {

              private final String SIGNAL_URL =
                  "https://shingmong85-web.github.io/live-signal-scanner/signal.json";

              TextView pair;
              TextView signal;
              TextView details;
              TextView updated;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(com.smcsingle.app.R.layout.activity_main);

                  pair = findViewById(R.id.pair);
                  signal = findViewById(R.id.signal);
                  details = findViewById(R.id.details);
                  updated = findViewById(R.id.updated);

                  Button refresh = findViewById(R.id.refresh);

                  refresh.setOnClickListener(v -> loadSignal());

                  loadSignal();
              }

              private void loadSignal() {

                  pair.setText("LOADING...");
                  signal.setText("WAITING");

                  new Thread(() -> {

                      try {

                          URL url = new URL(
                              SIGNAL_URL + "?t=" +
                              System.currentTimeMillis()
                          );

                          HttpURLConnection c =
                              (HttpURLConnection) url.openConnection();

                          c.setConnectTimeout(10000);
                          c.setReadTimeout(10000);

                          java.io.InputStream in =
                              c.getInputStream();

                          java.util.Scanner scanner =
                              new java.util.Scanner(in)
                              .useDelimiter("\\A");

                          String text =
                              scanner.hasNext()
                              ? scanner.next()
                              : "";

                          JSONObject data =
                              new JSONObject(text);

                          runOnUiThread(() -> {

                              String p =
                                  data.optString("pair", "");

                              String bias =
                                  data.optString("bias", "");

                              int score =
                                  data.optInt("score", 0);

                              String tf5 =
                                  data.optString(
                                      "tf5",
                                      "NO SIGNAL"
                                  );

                              String tf1 =
                                  data.optString(
                                      "tf1",
                                      "NO SIGNAL"
                                  );

                              String price =
                                  data.optString(
                                      "price",
                                      "--"
                                  );

                              String rsi =
                                  data.optString(
                                      "rsi",
                                      "--"
                                  );

                              pair.setText(
                                  p.isEmpty()
                                  ? "NO SIGNAL"
                                  : p
                              );

                              signal.setText(
                                  bias.isEmpty()
                                  ? "NO SIGNAL"
                                  : bias
                              );

                              if (bias.equals("UP")) {
                                  signal.setTextColor(
                                      Color.rgb(
                                          69, 212, 131
                                      )
                                  );
                              }
                              else if (bias.equals("DOWN")) {
                                  signal.setTextColor(
                                      Color.rgb(
                                          255, 104, 120
                                      )
                                  );
                              }
                              else {
                                  signal.setTextColor(
                                      Color.rgb(
                                          255, 209, 102
                                      )
                                  );
                              }

                              details.setText(
                                  "Score: " +
                                  (score > 0
                                      ? score + "/8"
                                      : "--") +
                                  "\\n5M: " + tf5 +
                                  "\\n1M: " + tf1 +
                                  "\\nPrice: " + price +
                                  "\\nRSI: " + rsi
                              );

                              updated.setText(
                                  data.optString(
                                      "updated",
                                      "Waiting..."
                                  )
                              );
                          });

                      } catch (Exception e) {

                          runOnUiThread(() -> {
                              pair.setText("DATA ERROR");
                              signal.setText("WAITING");
                              updated.setText(
                                  "Could not load signal"
                              );
                          });
                      }

                  }).start();
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip

      - name: Build APK
        run: |
          ./gradle-8.10.2/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMC-ICT-Single-APK
          path: app/build/outputs/apk/debug/app-debug.apk
