
<!DOCTYPE html>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1020;
    color:white;
}

.container{
    max-width:520px;
    margin:auto;
    padding:18px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.title{

.card{

}

label{
    display:block;
    font-size:13px;
    color:#aebbd2;

}

}

button{
    margin-top:12px;
    background:#285bd7;
    border:none;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.pair{
    font-size:27px;
    font-weight:bold;
}

.timeframe{
    color:#9eacc4;
    margin-top:4px;
}

.result{

    font-weight:bold;

.up{
    color:#45d483;
}

.down{
    color:#ff6878;
}

.none{
    color:#ffd166;
}

.score{
    font-size:18px;
}
