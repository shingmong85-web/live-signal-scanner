<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMC ICT Single Scanner</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080d18">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d18;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 18px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.title {
  font-size: 22px;
  font-weight: 800;
}

.badge {
  background: #17233d;
  color: #9db6ff;
  padding: 7px 11px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold;
}

.card {
  background: #111a2d;
  border: 1px solid #263653;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 14px;
}

.single-title {
  color: #9eacc4;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

select {
  width: 100%;
  padding: 14px;
  border-radius: 13px;
  border: 1px solid #314362;
  background: #0b1323;
  color: white;
  font-size: 16px;
  font-weight: bold;
  outline: none;
  margin-bottom: 10px;
}

.pair {
  font-size: 31px;
  font-weight: 800;
}

.signal {
  text-align: center;
  font-size: 42px;
  font-weight: 900;
  margin: 18px 0;
}

.up {
  color: #45d483;
}

.down {
  color: #ff6878;
}

.none {
  color: #ffd166;
}

.score {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 18px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.box {
  background: #0b1323;
  border-radius: 14px;
  padding: 14px;
  border: 1px solid #1c2a43;
}

.label {
  color: #7f8da7;
  font-size: 11px;
  margin-bottom: 6px;
}

.value {
  font-size: 17px;
  font-weight: 800;
}

.confirmed {
  color: #45d483;
}

.waiting {
  color: #ffd166;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 13px;
  background: #285bd7;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

.updated {
  color: #9aa8c0;
  font-size: 13px;
}

.footer {
  text-align: center;
  color: #65738d;
  font-size: 11px;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="title">SMC + ICT Single</div>
    <div class="badge">PAPER</div>
  </div>

  <div class="card">

    <div class="single-title">
      SELECT PAIR
    </div>

    <select id="pairSelect">
      <option value="EUR/USD">EUR/USD</option>
      <option value="GBP/USD">GBP/USD</option>
      <option value="USD/JPY">USD/JPY</option>
      <option value="AUD/USD">AUD/USD</option>
      <option value="USD/CAD">USD/CAD</option>
      <option value="USD/CHF">USD/CHF</option>
      <option value="EUR/GBP">EUR/GBP</option>
      <option value="EUR/JPY">EUR/JPY</option>
      <option value="GBP/JPY">GBP/JPY</option>
      <option value="BTC/USD">BTC/USD</option>
      <option value="ETH/USD">ETH/USD</option>
    </select>

    <button onclick="refreshSignal()">
      🔍 GET SINGLE
    </button>

  </div>

  <div class="card">

    <div class="single-title">
      BEST SINGLE
    </div>

    <div id="pair" class="pair">
      DATA WAITING
    </div>

    <div id="signal" class="signal none">
      WAITING
    </div>

    <div id="score" class="score">
      Score: --
    </div>

    <div class="grid">

      <div class="box">
        <div class="label">5M CONFIRMATION</div>
        <div id="tf5" class="value waiting">--</div>
      </div>

      <div class="box">
        <div class="label">1M CONFIRMATION</div>
        <div id="tf1" class="value waiting">--</div>
      </div>

      <div class="box">
        <div class="label">PRICE</div>
        <div id="price" class="value">--</div>
      </div>

      <div class="box">
        <div class="label">RSI</div>
        <div id="rsi" class="value">--</div>
      </div>

    </div>

  </div>

  <div class="card">

    <div class="single-title">
      LAST UPDATE
    </div>

    <div id="updated" class="updated">
      Waiting...
    </div>

  </div>

  <div class="footer">
    SMC + ICT • 1M / 5M • Paper Analysis Only
  </div>

</div>

<script>

async function refreshSignal() {

  const selectedPair =
    document.getElementById("pairSelect").value;

  try {

    const response = await fetch(
      "signal.json?time=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "signal.json HTTP " + response.status
      );
    }

    const data = await response.json();

    /*
      Current scanner saves only the BEST SINGLE.
      Therefore we only display it when the selected
      pair matches the saved signal.
    */

    if (data.pair !== selectedPair) {

      document.getElementById("pair").textContent =
        selectedPair;

      document.getElementById("signal").textContent =
        "NO SIGNAL";

      document.getElementById("signal").className =
        "signal none";

      document.getElementById("score").textContent =
        "No confirmed setup";

      document.getElementById("tf5").textContent =
        "NO SIGNAL";

      document.getElementById("tf1").textContent =
        "NO SIGNAL";

      document.getElementById("price").textContent =
        "--";

      document.getElementById("rsi").textContent =
        "--";

      document.getElementById("updated").textContent =
        "Selected pair is not the current Best Single";

      return;
    }

    document.getElementById("pair").textContent =
      data.pair || selectedPair;

    document.getElementById("score").textContent =
      data.score
        ? "Score: " + data.score + "/8"
        : "Score: --";

    document.getElementById("tf5").textContent =
      data.tf5 || "NO SIGNAL";

    document.getElementById("tf1").textContent =
      data.tf1 || "NO SIGNAL";

    document.getElementById("price").textContent =
      data.price != null
        ? data.price
        : "--";

    document.getElementById("rsi").textContent =
      data.rsi != null
        ? Number(data.rsi).toFixed(2)
        : "--";

    document.getElementById("updated").textContent =
      data.updated || "Waiting...";

    const signal =
      document.getElementById("signal");

    if (data.bias === "UP") {

      signal.textContent = "↑ UP";
      signal.className = "signal up";

    } else if (data.bias === "DOWN") {

      signal.textContent = "↓ DOWN";
      signal.className = "signal down";

    } else {

      signal.textContent = "NO SIGNAL";
      signal.className = "signal none";

    }

  } catch (error) {

    document.getElementById("pair").textContent =
      selectedPair;

    document.getElementById("signal").textContent =
      "DATA ERROR";

    document.getElementById("signal").className =
      "signal none";

    document.getElementById("updated").textContent =
      "Cannot load signal.json";

    console.log(error);
  }
}

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function () {

      navigator.serviceWorker
        .register("sw.js")
        .catch(function(error) {

          console.log(
            "Service Worker Error:",
            error
          );

        });

    }
  );

}

</script>

</body>
</html>
