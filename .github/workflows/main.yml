name: Signal Scanner Test

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      pair:
        description: "Select pair for paper analysis"
        required: true
        default: "EUR/USD"
        type: choice
        options:
          - EUR/USD
          - GBP/USD
          - USD/JPY
          - AUD/USD
          - USD/CAD
          - USD/CHF
          - EUR/GBP
          - EUR/JPY
          - GBP/JPY
          - BTC/USD
          - ETH/USD

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Set selected pair
        run: |
          if [ -n "${{ github.event.inputs.pair }}" ]; then
            echo "SELECTED_PAIR=${{ github.event.inputs.pair }}" >> "$GITHUB_ENV"
          else
            echo "SELECTED_PAIR=EUR/USD" >> "$GITHUB_ENV"
          fi

      - name: Run scanner
        run: |
          echo "Selected pair: $SELECTED_PAIR"
          python scanner.py

      - name: Update signal.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add signal.json

          if git diff --cached --quiet; then
            echo "No signal data changes"
          else
            git commit -m "[skip ci] Update signal data"
            git push
          fi

      - name: Upload scanner result
        uses: actions/upload-artifact@v4
        with:
          name: scanner-result
          path: |
            signal.json
            signal_history.csv
          if-no-files-found: ignore
